<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#160b2b">
<title>PURPLE HEARTS JAR 💜</title>
<style>
:root{color-scheme:dark;--ink:#f8efff;--muted:#cbb8dc;--lav:#d9a8ff;--violet:#9b55e8;--deep:#160b2b}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px 16px;color:var(--ink);font-family:Georgia,'Times New Roman',serif;background:radial-gradient(ellipse at 50% 32%,#563078 0%,#352052 42%,#211334 100%);overflow-x:hidden;position:relative;isolation:isolate}
main{position:relative;z-index:1;width:min(100%,620px);text-align:center}.eyebrow{font:600 11px/1.4 system-ui,sans-serif;letter-spacing:.28em;color:#d8b8f2}.title{font-size:clamp(29px,7vw,48px);font-weight:500;letter-spacing:.08em;margin:12px 0 5px;text-shadow:0 0 26px #b56bff77}.sub{font:14px system-ui,sans-serif;color:var(--muted);margin:0 0 14px}
.jar-wrap{position:relative;width:min(84vw,390px);height:min(104vw,445px);max-height:445px;margin:0 auto 6px;filter:drop-shadow(0 22px 32px #08031188)}
.jar{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.glass{fill:url(#glass);stroke:#f3e8ffb5;stroke-width:3}.rim{fill:#d8c4ed22;stroke:#f4eaffd9;stroke-width:4}.base{fill:#e9d9ff18;stroke:#f4eaff99;stroke-width:2}.shine{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;opacity:.55}
.count{font-size:clamp(54px,13vw,78px);line-height:1;font-weight:500;text-shadow:0 0 25px #c17aff66;font-variant-numeric:tabular-nums;margin-top:-8px}
.count-label{font:600 11px system-ui,sans-serif;letter-spacing:.24em;color:#d8c1ee;margin-top:8px}
.milestone-heading{font:700 11px/1.4 system-ui,sans-serif;letter-spacing:.3em;color:#e5c7ff;margin:28px 0 12px;text-shadow:0 0 16px #b56bff88}
.milestones{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 auto 18px;font:600 13px system-ui,sans-serif;color:#d9c5eb}
.milestones span{min-width:54px;border:1px solid #c99be66b;border-radius:13px;padding:11px 13px;background:linear-gradient(145deg,#ffffff12,#ffffff05);box-shadow:inset 0 1px #ffffff12;transition:transform .25s ease,box-shadow .25s ease,background .25s ease}
.milestones span::after{content:"";display:block;font-size:8px;letter-spacing:.12em;color:#bda4d3;margin-top:4px}
.milestones .reached{background:linear-gradient(145deg,#b66aff66,#7130a766);border-color:#e0b7ff;color:#fff;box-shadow:0 0 20px #a64dff44,inset 0 1px #ffffff35}
.milestones .reached::after{content:"REACHED";color:#f3ddff}
.heart-enter{animation:heartPop .75s cubic-bezier(.16,.85,.3,1.25) both}
@keyframes heartPop{0%{opacity:0;transform:scale(.12) translateY(-24px)}65%{opacity:1;transform:scale(1.28) translateY(2px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.preview-note{font:10px system-ui,sans-serif;letter-spacing:.16em;color:#e6caff;margin-top:8px;opacity:.85}
.message{min-height:30px;font-size:clamp(17px,4vw,22px);color:#f2dcff;text-shadow:0 0 16px #bd7bff66;margin:12px 0 0}
.footer{font:11px system-ui,sans-serif;letter-spacing:.08em;color:#a990bf;margin-top:27px}
.heart{filter:drop-shadow(0 1px 5px #b55cffbb)}
/* Ambient light, glossy drifting bubbles, and a swimming whale */
body::before,body::after{content:"";position:fixed;width:42vmax;height:42vmax;border-radius:50%;filter:blur(85px);opacity:.19;pointer-events:none;z-index:-2;animation:ambientDrift 16s ease-in-out infinite alternate}
body::before{background:#a044ff;top:-24vmax;left:-18vmax}
body::after{background:#6c32d8;right:-22vmax;bottom:-25vmax;animation-delay:-8s}
.cursor-glow{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;background:radial-gradient(230px circle at var(--mouse-x,50%) var(--mouse-y,50%),#c77aff26,transparent 72%);transition:opacity .35s ease}
.jar-wrap{transition:transform .55s cubic-bezier(.2,.8,.2,1),filter .55s ease}
.jar-wrap:hover{transform:translateY(-3px) scale(1.01);filter:drop-shadow(0 25px 38px #a34cff77)}
#hearts g{transition:transform .22s ease-out}
@media(hover:hover) and (pointer:fine){.jar-wrap{cursor:crosshair}}
.jar-wrap::after{content:"";position:absolute;inset:8% 10%;border-radius:48%;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 35% 30%,#fff5,transparent 48%);transition:opacity .5s ease}
.jar-wrap:hover::after{opacity:.65}
.title{transition:text-shadow .4s ease}
.title:hover{text-shadow:0 0 12px #d8a4ff,0 0 38px #a64dff,0 0 65px #7e32d9}
#hearts g{transform-box:fill-box;transform-origin:center;animation:heartBob 3.4s ease-in-out infinite alternate}
#hearts g:nth-child(3n){animation-delay:-1.2s}
#hearts g:nth-child(3n + 1){animation-delay:-2.1s}
.count{transition:transform .3s ease,text-shadow .3s ease}
.count:hover{transform:scale(1.045);text-shadow:0 0 18px #e1b7ff,0 0 38px #a64dff}
.milestones span{transition:transform .25s ease,box-shadow .25s ease,background .25s ease}
.milestones span:hover{transform:translateY(-4px);box-shadow:0 0 18px #b96aff55}
@keyframes ambientDrift{from{transform:translate3d(-2%,0,0) scale(.92)}to{transform:translate3d(8%,9%,0) scale(1.12)}}
@keyframes heartBob{from{translate:0 0}to{translate:0 -3px}}
@media(hover:hover) and (pointer:fine){.cursor-glow{opacity:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.bubble-field{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.bubble{position:absolute;display:block;border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff7 0%,#f1dcff42 9%,#d1a4ff25 24%,#a879ed18 54%,#ffffff04 74%);border:1px solid #f5e6ff24;box-shadow:inset -14px -18px 36px #a86de51c,inset 8px 8px 24px #fff2,0 0 38px #b77af01c;filter:blur(1.2px);animation:bubbleFloat var(--duration,22s) ease-in-out infinite alternate;opacity:var(--opacity,.48)}
.bubble:nth-child(1){width:clamp(170px,27vw,310px);height:clamp(170px,27vw,310px);left:-5%;top:12%;--duration:27s;--opacity:.42}.bubble:nth-child(2){width:clamp(130px,20vw,230px);height:clamp(130px,20vw,230px);left:73%;top:4%;--duration:23s;animation-delay:-6s;--opacity:.36}.bubble:nth-child(3){width:clamp(210px,34vw,390px);height:clamp(210px,34vw,390px);left:78%;top:60%;--duration:31s;animation-delay:-12s;--opacity:.3}.bubble:nth-child(4){width:clamp(145px,23vw,270px);height:clamp(145px,23vw,270px);left:13%;top:72%;--duration:25s;animation-delay:-8s;--opacity:.36}.bubble:nth-child(5){width:clamp(95px,15vw,170px);height:clamp(95px,15vw,170px);left:48%;top:3%;--duration:21s;animation-delay:-3s;--opacity:.32}.bubble:nth-child(6){width:clamp(180px,28vw,330px);height:clamp(180px,28vw,330px);left:42%;top:83%;--duration:29s;animation-delay:-10s;--opacity:.26}.bubble:nth-child(7){width:clamp(120px,18vw,210px);height:clamp(120px,18vw,210px);left:89%;top:33%;--duration:24s;animation-delay:-4s;--opacity:.35}
@keyframes bubbleFloat{0%{transform:translate3d(-12px,18px,0) scale(.92)}100%{transform:translate3d(22px,-28px,0) scale(1.08)}}
.whale-flight{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden;opacity:.62}
.whale{position:absolute;width:clamp(190px,34vw,300px);height:auto;left:0;top:0;filter:drop-shadow(0 0 8px #dba0ff88) drop-shadow(0 0 24px #9b55e855);animation:whaleJourney 34s ease-in-out infinite;will-change:transform}
.whale .body{fill:url(#whaleGradient);stroke:#c9b9f2;stroke-width:1.7;stroke-linejoin:round}
.whale .glint{fill:none;stroke:#d8d0f6;stroke-width:1.4;stroke-linecap:round;opacity:.55}
.whale .baleen{fill:none;stroke:#bcb0e9;stroke-width:1.15;stroke-linecap:round;opacity:.68}
.whale .tail{transform-box:fill-box;transform-origin:50% 50%;animation:tailSweep 2.2s ease-in-out infinite alternate}
.whale .fin{transform-box:fill-box;transform-origin:10% 15%;animation:finSweep 2.9s ease-in-out infinite alternate}
@keyframes whaleJourney{
0%{transform:translate(-38vw,72vh) rotate(-18deg) scale(.72)}
16%{transform:translate(10vw,48vh) rotate(-8deg) scale(.88)}
33%{transform:translate(48vw,24vh) rotate(8deg) scale(1)}
50%{transform:translate(74vw,43vh) rotate(24deg) scale(.9) scaleX(-1)}
67%{transform:translate(47vw,67vh) rotate(7deg) scale(.82) scaleX(-1)}
84%{transform:translate(8vw,42vh) rotate(-12deg) scale(.94) scaleX(-1)}
100%{transform:translate(-38vw,72vh) rotate(-18deg) scale(.72)}
}
@keyframes tailSweep{from{transform:rotate(-18deg) scaleY(.92)}to{transform:rotate(18deg) scaleY(1.08)}}
@keyframes finSweep{from{transform:rotate(-8deg)}to{transform:rotate(9deg)}}
.jar-wrap{touch-action:none;user-select:none;-webkit-user-select:none}
@media(prefers-reduced-motion:reduce){.bubble,.whale{animation:none!important}}

</style>
</head>
<body>

<div class="bubble-field" aria-hidden="true"><i class="bubble"></i><i class="bubble"></i><i class="bubble"></i><i class="bubble"></i><i class="bubble"></i><i class="bubble"></i><i class="bubble"></i></div>
<div class="whale-flight" aria-hidden="true"><svg class="whale" viewBox="0 0 420 230"><defs><linearGradient id="whaleGradient" x1="0" y1="0" x2=".25" y2="1"><stop stop-color="#8274b5"/><stop offset=".32" stop-color="#403665"/><stop offset=".72" stop-color="#211d43"/><stop offset="1" stop-color="#17142f"/></linearGradient><linearGradient id="finGradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#74689d"/><stop offset="1" stop-color="#211b40"/></linearGradient></defs>
<path class="body" d="M20 91 C28 72 47 61 73 57 C101 51 133 57 164 62 C205 67 246 62 282 69 C318 75 346 91 369 111 C382 121 394 124 409 117 C401 137 382 145 362 137 C337 157 304 167 263 168 C230 169 205 161 178 158 C146 154 111 147 82 134 C52 121 30 108 20 91Z"/>
<path class="body" d="M363 125 C382 109 402 103 418 112 C409 122 399 129 388 133 C402 136 411 143 418 154 C398 150 380 144 365 137Z"/>
<path class="body" d="M176 148 C193 165 205 188 211 213 C214 226 205 231 194 219 C174 200 157 177 147 154Z" style="fill:url(#finGradient)"/>
<path class="body" d="M290 163 Q303 169 317 165 Q310 177 296 177Z"/>
<path class="glint" d="M30 87 Q52 111 83 124 Q122 141 163 147"/>
<path class="baleen" d="M36 92 Q72 126 119 137 M42 85 Q79 116 126 129 M51 78 Q87 105 133 120 M65 70 Q99 94 143 111 M82 64 Q111 84 154 102 M100 61 Q126 77 166 94"/>
<path class="glint" d="M177 69 Q233 73 278 78 Q325 86 355 112"/>
<path class="glint" d="M180 156 Q197 181 202 208"/>
<path class="glint" d="M32 88 Q23 84 18 76"/>
<path d="M52 70 Q74 61 91 65" fill="none" stroke="#bcb0e9" stroke-width="2" opacity=".6"/>
<circle cx="347" cy="112" r="3" fill="#f3eaff" opacity=".8"/>
<g fill="#d4c9ef" opacity=".6"><circle cx="30" cy="97" r="3"/><circle cx="42" cy="107" r="2.2"/><circle cx="54" cy="115" r="2"/></g>
</svg></div>
<div class="cursor-glow" aria-hidden="true"></div>
<main>
  <div class="eyebrow">BPSTPH · STATIONHEAD</div>
  <h1 class="title">PURPLE HEARTS JAR</h1>
  <p class="sub">Every listener adds a little more love.</p>
  <div class="jar-wrap" id="jarWrap" aria-label="A glass jar filling with purple hearts">
    <svg class="jar" viewBox="0 0 400 450" role="img" aria-hidden="true">
      <defs>
        <linearGradient id="glass" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".18" stop-color="#fff" stop-opacity=".035"/><stop offset=".78" stop-color="#d8b9ff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity=".2"/></linearGradient>
        <linearGradient id="neck" x1="0" x2="1"><stop stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity=".2"/></linearGradient>
        <clipPath id="inside"><path d="M118 95 Q118 80 137 80 H263 Q282 80 282 95 L300 135 Q311 157 311 183 V377 Q311 405 283 405 H117 Q89 405 89 377 V183 Q89 157 100 135Z"/></clipPath>
      </defs>
      <ellipse cx="200" cy="418" rx="125" ry="13" fill="#05020c" opacity=".35"/>
      <path class="glass" d="M118 95 Q118 80 137 80 H263 Q282 80 282 95 L300 135 Q311 157 311 183 V377 Q311 405 283 405 H117 Q89 405 89 377 V183 Q89 157 100 135Z"/>
      <path fill="url(#neck)" stroke="#f4eaff99" stroke-width="2" d="M125 43 Q125 35 137 35 H263 Q275 35 275 43 V92 H125Z"/>
      <path class="rim" d="M119 39 Q119 27 134 27 H266 Q281 27 281 39 V51 Q281 61 266 61 H134 Q119 61 119 51Z"/>
      <path class="base" d="M96 377 Q200 392 304 377 V389 Q304 414 280 414 H120 Q96 414 96 389Z"/>
      <path class="shine" d="M112 158 Q101 190 104 236 V346"/>
      <path class="shine" d="M288 171 Q299 207 296 255" opacity=".22"/>
      <g id="hearts" clip-path="url(#inside)"></g>
      <path d="M100 365 Q200 378 300 365" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
    </svg>
  </div>
  <div class="count" id="count" aria-live="polite">—</div>
  <div class="count-label">HEARTS INSIDE THE JAR</div>
  <div class="milestone-heading">STREAMING MILESTONES</div>
  <div class="milestones" id="milestones"><span data-n="7">7</span><span data-n="17">17</span><span data-n="37">37</span><span data-n="77">77</span><span data-n="100">100</span></div>
  <p class="message" id="message">Connecting to BPSTPH public profile… 💜</p>
  <div class="preview-note" id="previewNote" hidden>VISUAL PREVIEW · SAMPLE HEART</div>
  <div class="footer">YOUR STREAMS ARE COUNTED</div>
</main>
<script>
/* Set this after deploying stationhead-bridge.js as a Cloudflare Worker. */
const LISTENER_BRIDGE_URL = "https://bpstph-listener-bridge.workwithcelestal.workers.dev/";
const POLL_INTERVAL_MS = 10000;
const heartLayer = document.getElementById("hearts");
const countNode = document.getElementById("count");
const messageNode = document.getElementById("message");
const milestoneNodes = [...document.querySelectorAll(".milestones span")];
// A soft purple spotlight follows the mouse on desktop; it is hidden on touch devices.
if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
  document.addEventListener("pointermove", (event) => {
    document.documentElement.style.setProperty("--mouse-x", event.clientX + "px");
    document.documentElement.style.setProperty("--mouse-y", event.clientY + "px");
  }, { passive: true });
}

function heartSvg(x,y,size,opacity,rotation){
  const ns="http://www.w3.org/2000/svg",g=document.createElementNS(ns,"g");
  g.setAttribute("transform",`translate(${x} ${y}) rotate(${rotation}) scale(${size/24})`);
  g.setAttribute("opacity",opacity);
  const p=document.createElementNS(ns,"path");
  p.setAttribute("d","M12 21s-9-5.7-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.3-9 12-9 12Z");
  p.setAttribute("fill",["#c58aff","#a95df0","#e0b7ff","#8d42d8","#d49cff"][Math.floor(Math.random()*5)]);
  p.setAttribute("stroke","#f2ddff");p.setAttribute("stroke-opacity",".5");p.setAttribute("stroke-width",".65");
  g.appendChild(p);return g;
}
const heartNodes = [];
// Hearts are gently pushed away from the cursor, like they are being nahahawi.
const jarWrap = document.getElementById("jarWrap");
let pointerInsideJar = false;
jarWrap.addEventListener("pointerdown", (event) => { pointerInsideJar = true; });
jarWrap.addEventListener("pointermove", (event) => {
  pointerInsideJar = true;
  const rect = jarWrap.getBoundingClientRect();
  const px = ((event.clientX - rect.left) / rect.width) * 400;
  const py = ((event.clientY - rect.top) / rect.height) * 450;
  const cx = 200, cy = 260;
  heartNodes.forEach((node, index) => {
    const baseX = Number(node.dataset.baseX);
    const baseY = Number(node.dataset.baseY);
    if (!Number.isFinite(baseX) || !Number.isFinite(baseY)) return;
    const dx = baseX - px, dy = baseY - py;
    const distance = Math.sqrt(dx*dx + dy*dy);
    const influence = Math.max(0, 1 - distance / 115);
    const push = influence * 19;
    const length = Math.max(1, distance);
    const driftX = (dx / length) * push;
    const driftY = (dy / length) * push;
    node.setAttribute("transform", `translate(${baseX + driftX} ${baseY + driftY})`);
  });
});
function restoreHeartPositions(){
  pointerInsideJar = false;
  heartNodes.forEach(node => {
    const x=Number(node.dataset.baseX), y=Number(node.dataset.baseY);
    if(Number.isFinite(x)&&Number.isFinite(y)) node.setAttribute("transform",`translate(${x} ${y})`);
  });
}
jarWrap.addEventListener("pointerleave", restoreHeartPositions);
jarWrap.addEventListener("pointerup", restoreHeartPositions);
jarWrap.addEventListener("pointercancel", restoreHeartPositions);
function createHeartAt(index, animate=false){
  const ns="http://www.w3.org/2000/svg";
  let x,y,startY,size=30+Math.random()*6;
  if(index<180){
    const col=index%9,row=Math.floor(index/9);
    x=112+col*22+(Math.random()*7-3.5);
    y=385-row*16+(Math.random()*6-3);
    startY=48;
  }else{
    x=95+Math.random()*210;y=40+Math.random()*70;startY=y-35;
    size=28+Math.random()*8;
  }
  const wrapper=document.createElementNS(ns,"g");
  wrapper.dataset.baseX=String(x); wrapper.dataset.baseY=String(y);
  wrapper.setAttribute("transform",`translate(${x} ${animate?startY:y})`);
  const heart=heartSvg(0,0,size,.78+Math.random()*.22,-18+Math.random()*36);
  wrapper.appendChild(heart);
  heartLayer.appendChild(wrapper);
  if(animate){
    const fall=document.createElementNS(ns,"animateTransform");
    fall.setAttribute("attributeName","transform");
    fall.setAttribute("type","translate");
    fall.setAttribute("from",`0 0`);
    fall.setAttribute("to",`0 ${y-startY}`);
    fall.setAttribute("dur","850ms");
    fall.setAttribute("begin","0s");
    fall.setAttribute("fill","freeze");
    fall.setAttribute("calcMode","spline");
    fall.setAttribute("keySplines",".2 .7 .25 1");
    wrapper.appendChild(fall);
    fall.beginElement();
    wrapper.style.filter="drop-shadow(0 0 9px #e2b7ff)";
    setTimeout(()=>{wrapper.style.filter="";},950);
  }
  return wrapper;
}
function drawHearts(n, animateNew=false){
  const visible=Math.min(n,210);
  while(heartNodes.length>visible){
    const node=heartNodes.pop();node.remove();
  }
  while(heartNodes.length<visible){
    const index=heartNodes.length;
    heartNodes.push(createHeartAt(index,animateNew));
  }
}
let lastRenderedCount = null;
function render(n){
  const count=Math.max(0,Math.floor(Number(n)||0));
  if(count!==lastRenderedCount){
    const previousCount=lastRenderedCount===null?0:lastRenderedCount;
    countNode.textContent=count.toLocaleString();
    drawHearts(count, lastRenderedCount!==null && count>previousCount);
    lastRenderedCount=count;
  }
  milestoneNodes.forEach(el=>el.classList.toggle("reached",count>=Number(el.dataset.n)));
  messageNode.textContent=count>100?"Hearts overflowing = Your streams are counted.":count===100?"Let’s add more hearts and streams! 💜":count>=77?"77 hearts reached 💜":count>=37?"37 hearts reached 💜":count>=17?"17 hearts reached 💜":count>=7?"7 hearts reached 💜":"Every listener adds a heart.";
}
async function update(){
  if(LISTENER_BRIDGE_URL.includes("PASTE_YOUR_")) {
    messageNode.textContent="Bridge setup needed to connect BPSTPH live count 💜";
    return;
  }
  try{
    const response=await fetch(LISTENER_BRIDGE_URL,{cache:"no-store"});
    const data=await response.json();
    if(!response.ok || !Number.isInteger(Number(data.listeners))) {
      throw new Error(data.error || ("Bridge returned HTTP " + response.status));
    }
    render(data.listeners);
  }catch(error){
    countNode.textContent="—";
    messageNode.textContent=(error.message || "Could not read BPSTPH listener data") + " · Retrying…";
    console.warn("BPSTPH listener bridge:",error);
  }
}
const previewMode = new URLSearchParams(window.location.search).get("demo");
if(previewMode === "100"){
  document.getElementById("previewNote").hidden=false;
  document.getElementById("previewNote").textContent="VISUAL PREVIEW · 100 LISTENERS";
  render(100);
  messageNode.textContent="Let’s add more hearts and streams! 💜";
}else if(previewMode === "1"){
  document.getElementById("previewNote").hidden=false;
  document.getElementById("previewNote").textContent="VISUAL PREVIEW · SAMPLE HEART";
  render(0);
  setTimeout(()=>{
    render(1);
    messageNode.textContent="A new listener joined. Watch the heart fall into the jar! 💜";
  },650);
}else{
  update();
  setInterval(update,POLL_INTERVAL_MS);
}
</script>
</body>
</html>
